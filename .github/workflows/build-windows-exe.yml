name: Build HNL Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: hnl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

      - name: TypeScript check
        run: npm run lint

      - name: Build Windows Setup + Portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify EXE output
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "Không tìm thấy file EXE trong release/" }
          $files | Format-Table Name, Length, LastWriteTime

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HNL-Structural-AI-Windows-v1.3.0
          path: |
            release/*.exe
            release/*.yml
          if-no-files-found: error
          retention-days: 30
