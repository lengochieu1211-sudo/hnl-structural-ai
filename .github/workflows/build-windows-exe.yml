name: Build HNL Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

concurrency:
  group: hnl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }

      - name: TypeScript check
        run: npm run lint

      - name: Build Windows Setup + Portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify Windows outputs
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "HNL-Structural-AI-Setup-*.exe" -ErrorAction SilentlyContinue
          $portable = Get-ChildItem release -Filter "HNL-Structural-AI-Portable-*.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Thiếu file Setup EXE" }
          if (-not $portable) { throw "Thiếu file Portable EXE" }
          Write-Host "=== SETUP ==="
          $setup | Format-Table Name, Length, LastWriteTime
          Write-Host "=== PORTABLE ==="
          $portable | Format-Table Name, Length, LastWriteTime

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: HNL-Structural-AI-Windows-v1.3.1
          path: |
            release/HNL-Structural-AI-Setup-*.exe
            release/HNL-Structural-AI-Portable-*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
          retention-days: 30
